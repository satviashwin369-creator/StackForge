<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="ciArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2088ff"/>
    </marker>
    <marker id="ciArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad9)"/>
  <rect x="15" y="15" width="1170" height="770" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#2088ff"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">🔄</text>
    <text x="55" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">StackForge — Automated CI/CD &amp; Artifact Release Pipeline</text>
    <text x="55" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">GitHub Actions Matrix (ci.yml) • In-Memory SQLite Isolation • Multi-Stage GHCR Publishing</text>
  </g>

  <!-- Step 1: VCS Trigger -->
  <g transform="translate(40, 95)" filter="url(#shadow9)">
    <rect width="240" height="180" rx="8" fill="url(#cardGrad9)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="26" rx="8" fill="#334155"/>
    <text x="15" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc">1. VCS TRIGGER</text>

    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">GitHub Repository</text>
    <text x="20" y="75" font-family="monospace" font-size="10" fill="#94a3b8">satviashwin369-creator/stackforge</text>

    <rect x="15" y="90" width="210" height="70" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="112" font-family="monospace" font-size="11" fill="#38bdf8">push: [main]</text>
    <text x="25" y="132" font-family="monospace" font-size="11" fill="#38bdf8">pull_request: [main]</text>
    <text x="25" y="150" font-family="monospace" font-size="10" fill="#a7f3d0">PR #1: refactor/devops-hardening</text>
  </g>

  <!-- Step 2: GitHub Actions Matrix -->
  <g transform="translate(320, 95)" filter="url(#shadow9)">
    <rect width="520" height="420" rx="10" fill="url(#cardGrad9)" stroke="#2088ff" stroke-width="2"/>
    <rect x="0" y="0" width="520" height="28" rx="10" fill="#1d4ed8"/>
    <rect x="0" y="18" width="520" height="10" fill="#1d4ed8"/>
    <text x="15" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#eff6ff">2. GITHUB ACTIONS PARALLEL CI MATRIX (.github/workflows/ci.yml)</text>

    <!-- Job 1: Frontend CI -->
    <g transform="translate(20, 45)">
      <rect width="480" height="160" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="15" y="26" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">Job 1: Frontend CI (Node 20 Runner)</text>
      
      <rect x="15" y="40" width="450" height="30" rx="4" fill="#1e293b"/>
      <text x="25" y="60" font-family="monospace" font-size="11" fill="#cbd5e1">1. npm run lint</text>
      <text x="350" y="60" font-family="monospace" font-size="11" fill="#34d399">✓ 0 Errors / 0 Warnings</text>

      <rect x="15" y="78" width="450" height="30" rx="4" fill="#1e293b"/>
      <text x="25" y="98" font-family="monospace" font-size="11" fill="#cbd5e1">2. npx tsc --noEmit</text>
      <text x="350" y="98" font-family="monospace" font-size="11" fill="#34d399">✓ Strict Typecheck Pass</text>

      <rect x="15" y="116" width="450" height="30" rx="4" fill="#1e293b"/>
      <text x="25" y="136" font-family="monospace" font-size="11" fill="#cbd5e1">3. npm run build</text>
      <text x="350" y="136" font-family="monospace" font-size="11" fill="#34d399">✓ Next.js Standalone Build</text>
    </g>

    <!-- Job 2: Backend CI -->
    <g transform="translate(20, 220)">
      <rect width="480" height="180" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="15" y="26" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">Job 2: Backend CI (Python 3.12 Runner)</text>
      
      <rect x="15" y="40" width="450" height="30" rx="4" fill="#1e293b"/>
      <text x="25" y="60" font-family="monospace" font-size="11" fill="#cbd5e1">1. Module Patching in conftest.py</text>
      <text x="350" y="60" font-family="monospace" font-size="11" fill="#34d399">✓ SQLite StaticPool</text>

      <rect x="15" y="78" width="450" height="30" rx="4" fill="#1e293b"/>
      <text x="25" y="98" font-family="monospace" font-size="11" fill="#cbd5e1">2. Mock redis before app imports</text>
      <text x="350" y="98" font-family="monospace" font-size="11" fill="#34d399">✓ Zero External Network</text>

      <rect x="15" y="116" width="450" height="50" rx="4" fill="#1e293b"/>
      <text x="25" y="136" font-family="monospace" font-size="11" fill="#cbd5e1">3. pytest tests/ -v</text>
      <text x="25" y="154" font-family="monospace" font-size="10" fill="#94a3b8">test_auth.py • test_projects.py • test_ws.py</text>
      <text x="350" y="145" font-family="monospace" font-size="11" fill="#34d399">✓ 100% Pass (&lt; 5s)</text>
    </g>
  </g>

  <!-- Step 3: Docker Build & Publish -->
  <g transform="translate(880, 95)" filter="url(#shadow9)">
    <rect width="280" height="420" rx="10" fill="url(#cardGrad9)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="28" rx="10" fill="#047857"/>
    <rect x="0" y="18" width="280" height="10" fill="#047857"/>
    <text x="15" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#ecfdf5">3. DOCKER BUILD &amp; GHCR</text>

    <!-- Multi-Stage Backend -->
    <rect x="15" y="45" width="250" height="100" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="25" y="68" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">stackforge-backend</text>
    <text x="25" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Multi-stage Python slim image</text>
    <text x="25" y="108" font-family="monospace" font-size="9" fill="#cbd5e1">Tagged: :latest &amp; :${{ sha }}</text>
    <text x="25" y="128" font-family="monospace" font-size="9" fill="#34d399">Published to GHCR</text>

    <!-- Multi-Stage Frontend -->
    <rect x="15" y="160" width="250" height="100" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="25" y="183" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">stackforge-frontend</text>
    <text x="25" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Node 20 standalone image (~150MB)</text>
    <text x="25" y="223" font-family="monospace" font-size="9" fill="#cbd5e1">Tagged: :latest &amp; :${{ sha }}</text>
    <text x="25" y="243" font-family="monospace" font-size="9" fill="#34d399">Published to GHCR</text>

    <!-- Security Gate -->
    <rect x="15" y="275" width="250" height="125" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="25" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#facc15">Security Gate Enforcement:</text>
    <text x="25" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">• Image publish strictly restricted</text>
    <text x="35" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">to trusted merges on 'main'.</text>
    <text x="25" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">• Pull Requests build and validate</text>
    <text x="35" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">without push permissions.</text>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="185" x2="320" y2="185" stroke="#2088ff" stroke-width="2" marker-end="url(#ciArrow)"/>
  <line x1="840" y1="300" x2="880" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#ciArrowGreen)"/>

  <!-- Step 4: Continuous Deployment Rollout Target (Bottom) -->
  <g transform="translate(40, 545)" filter="url(#shadow9)">
    <rect width="1120" height="195" rx="10" fill="url(#cardGrad9)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="1120" height="28" rx="10" fill="#6d28d9"/>
    <rect x="0" y="18" width="1120" height="10" fill="#6d28d9"/>
    <text x="15" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#ede9fe">4. PRODUCTION ROLLOUT TARGETS (KUBERNETES &amp; DOCKER COMPOSE)</text>

    <!-- Path A: Docker Compose Local -->
    <rect x="25" y="45" width="520" height="130" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="40" y="70" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">Target A: Local Docker Compose (Continuous Testing)</text>
    <text x="40" y="92" font-family="monospace" font-size="10" fill="#cbd5e1">docker compose pull &amp;&amp; docker compose up -d</text>
    <text x="40" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Instantly pulls latest GHCR images for zero-downtime local integration testing.</text>
    <text x="40" y="132" font-family="monospace" font-size="10" fill="#34d399">✓ 9 Containers UP • Named persistent volumes preserved</text>

    <!-- Path B: Kubernetes GitOps -->
    <rect x="575" y="45" width="520" height="130" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="590" y="70" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">Target B: Kubernetes Cluster (k8s/ &amp; Argo CD GitOps)</text>
    <text x="590" y="92" font-family="monospace" font-size="10" fill="#cbd5e1">kubectl set image deployment/backend-deployment backend=ghcr.io/...:${{ sha }}</text>
    <text x="590" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Rolling update ensures zero drop in active traffic; liveness probes verify pod health.</text>
    <text x="590" y="132" font-family="monospace" font-size="10" fill="#34d399">✓ Hardened non-root containers • Automatic Pod replacement</text>
  </g>
</svg>

