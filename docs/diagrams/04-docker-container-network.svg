<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad4)"/>
  <rect x="15" y="15" width="1170" height="770" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#2563eb"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">🐳</text>
    <text x="55" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">StackForge — Docker Container Runtime & Network Topology</text>
    <text x="55" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">9 Active Containers • Isolated Docker Bridge Network ('stackforge-network') • Persistent Named Volumes</text>
  </g>

  <!-- Left: Host Ingress Ports -->
  <g transform="translate(40, 95)" filter="url(#shadow4)">
    <rect width="200" height="660" rx="10" fill="url(#cardGrad4)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="26" rx="10" fill="#334155"/>
    <rect x="0" y="16" width="200" height="10" fill="#334155"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">HOST PORT BINDINGS</text>

    <!-- Port cards -->
    <g transform="translate(15, 45)">
      <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="15" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa">:3000</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Next.js Web Console</text>
    </g>

    <g transform="translate(15, 110)">
      <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
      <text x="15" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">:8000</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">FastAPI Core &amp; WS</text>
    </g>

    <g transform="translate(15, 175)">
      <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
      <text x="15" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa">:5432</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">PostgreSQL 16 DB</text>
    </g>

    <g transform="translate(15, 240)">
      <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1"/>
      <text x="15" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#f87171">:6379</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Redis 7 Broker</text>
    </g>

    <g transform="translate(15, 305)">
      <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">:9090</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Prometheus Scraper</text>
    </g>

    <g transform="translate(15, 370)">
      <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">:3001</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Grafana 12 Dashboard</text>
    </g>

    <g transform="translate(15, 435)">
      <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#fbbf24">:3100</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Grafana Loki Engine</text>
    </g>
  </g>

  <!-- Middle: Docker Bridge Network (stackforge-network) -->
  <g transform="translate(260, 95)" filter="url(#shadow4)">
    <rect width="660" height="660" rx="10" fill="#0c1322" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="0" y="0" width="660" height="30" rx="10" fill="#1e40af"/>
    <rect x="0" y="20" width="660" height="10" fill="#1e40af"/>
    <text x="20" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#eff6ff">DOCKER BRIDGE NETWORK: stackforge-network (Driver: bridge)</text>

    <!-- Row 1: App Services -->
    <!-- stackforge-frontend -->
    <g transform="translate(25, 50)">
      <rect width="185" height="110" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="15" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">stackforge-frontend</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Next.js 16.2 Standalone</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#94a3b8">Internal: :3000</text>
      <text x="15" y="85" font-family="monospace" font-size="10" fill="#34d399">USER: nextjs (UID 1001)</text>
    </g>

    <!-- stackforge-backend -->
    <g transform="translate(235, 50)">
      <rect width="185" height="110" rx="8" fill="#111827" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="15" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">stackforge-backend</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">FastAPI 0.115 ASGI</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#94a3b8">Internal: :8000</text>
      <text x="15" y="85" font-family="monospace" font-size="10" fill="#34d399">Probe: /health (200 OK)</text>
    </g>

    <!-- stackforge-worker -->
    <g transform="translate(445, 50)">
      <rect width="185" height="110" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="15" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">stackforge-worker</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Celery 5.4 Worker Pool</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#94a3b8">No host port mapped</text>
      <text x="15" y="85" font-family="monospace" font-size="10" fill="#a78bfa">Consumes celery queue</text>
    </g>

    <!-- Row 2: Data Services -->
    <!-- stackforge-db -->
    <g transform="translate(130, 200)">
      <rect width="185" height="110" rx="8" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
      <text x="15" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">stackforge-db</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">PostgreSQL 16 Alpine</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#94a3b8">Internal: :5432</text>
      <text x="15" y="85" font-family="monospace" font-size="10" fill="#34d399">Probe: pg_isready</text>
    </g>

    <!-- stackforge-redis -->
    <g transform="translate(345, 200)">
      <rect width="185" height="110" rx="8" fill="#111827" stroke="#dc2626" stroke-width="1.5"/>
      <text x="15" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#f87171">stackforge-redis</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Redis 7 Alpine</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#94a3b8">Internal: :6379</text>
      <text x="15" y="85" font-family="monospace" font-size="10" fill="#34d399">Probe: redis-cli ping</text>
    </g>

    <!-- Row 3: Observability Stack -->
    <!-- prometheus -->
    <g transform="translate(25, 350)">
      <rect width="140" height="95" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="10" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">prometheus</text>
      <text x="10" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">Prometheus v3.5</text>
      <text x="10" y="60" font-family="monospace" font-size="9" fill="#94a3b8">Internal: :9090</text>
      <text x="10" y="78" font-family="monospace" font-size="9" fill="#34d399">15s Scrape Loop</text>
    </g>

    <!-- grafana -->
    <g transform="translate(180, 350)">
      <rect width="140" height="95" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="10" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">grafana</text>
      <text x="10" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">Grafana 12.1.1</text>
      <text x="10" y="60" font-family="monospace" font-size="9" fill="#94a3b8">Internal: :3000</text>
      <text x="10" y="78" font-family="monospace" font-size="9" fill="#34d399">Auto-Provisioned</text>
    </g>

    <!-- loki -->
    <g transform="translate(335, 350)">
      <rect width="140" height="95" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="10" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">loki</text>
      <text x="10" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">Loki 3.5 Engine</text>
      <text x="10" y="60" font-family="monospace" font-size="9" fill="#94a3b8">Internal: :3100</text>
      <text x="10" y="78" font-family="monospace" font-size="9" fill="#34d399">LogQL Store</text>
    </g>

    <!-- alloy -->
    <g transform="translate(490, 350)">
      <rect width="140" height="95" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="10" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">alloy</text>
      <text x="10" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#cbd5e1">Grafana Alloy v1.10</text>
      <text x="10" y="60" font-family="monospace" font-size="9" fill="#94a3b8">Internal: :12345</text>
      <text x="10" y="78" font-family="monospace" font-size="9" fill="#34d399">Log Shipper</text>
    </g>

    <!-- Bottom summary note -->
    <rect x="25" y="580" width="605" height="50" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
    <text x="40" y="602" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#93c5fd">Zero Host Docker Socket Dependency in Core Profile</text>
    <text x="40" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Core 7 services run cleanly on Windows, macOS, and Linux without /var/run/docker.sock mounting.</text>
  </g>

  <!-- Right: Persistent Named Volumes -->
  <g transform="translate(940, 95)" filter="url(#shadow4)">
    <rect width="220" height="660" rx="10" fill="url(#cardGrad4)" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="26" rx="10" fill="#047857"/>
    <rect x="0" y="16" width="220" height="10" fill="#047857"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ecfdf5">PERSISTENT VOLUMES</text>

    <g transform="translate(15, 50)">
      <rect width="190" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">postgres_data</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Mount: /var/lib/postgresql/data</text>
      <text x="15" y="65" font-family="monospace" font-size="9" fill="#a7f3d0">Preserves users &amp; projects</text>
    </g>

    <g transform="translate(15, 155)">
      <rect width="190" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">prometheus_data</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Mount: /prometheus</text>
      <text x="15" y="65" font-family="monospace" font-size="9" fill="#a7f3d0">15-day time-series retention</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="190" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">grafana_data</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Mount: /var/lib/grafana</text>
      <text x="15" y="65" font-family="monospace" font-size="9" fill="#a7f3d0">Dashboard state &amp; admin</text>
    </g>

    <g transform="translate(15, 365)">
      <rect width="190" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">loki_data</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Mount: /loki</text>
      <text x="15" y="65" font-family="monospace" font-size="9" fill="#a7f3d0">Indexed log chunks</text>
    </g>
  </g>
</svg>

