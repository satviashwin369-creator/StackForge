<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="seqArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="seqArrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="seqArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad3)"/>
  <rect x="15" y="15" width="1170" height="770" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#10b981"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">🚀</text>
    <text x="55" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">StackForge — The "Deploy Packet" Complete Lifecycle Sequence</text>
    <text x="55" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Sub-50ms Asynchronous API Response • Redis Celery Queue • Sub-10ms WebSocket Log Broadcast</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- 1. Browser -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">1. Developer Browser</text>
    <line x1="70" y1="40" x2="70" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 2. Next.js Frontend -->
  <g transform="translate(220, 90)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">2. Next.js (:3000)</text>
    <line x1="70" y1="40" x2="70" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 3. FastAPI Gateway -->
  <g transform="translate(390, 90)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="70" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">3. FastAPI (:8000)</text>
    <line x1="70" y1="40" x2="70" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 4. PostgreSQL Database -->
  <g transform="translate(560, 90)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#1e293b" stroke="#2563eb" stroke-width="1.5"/>
    <text x="70" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">4. PostgreSQL (:5432)</text>
    <line x1="70" y1="40" x2="70" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 5. Redis Broker & PubSub -->
  <g transform="translate(730, 90)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
    <text x="70" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">5. Redis 7 (:6379)</text>
    <line x1="70" y1="40" x2="70" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 6. Celery Worker -->
  <g transform="translate(900, 90)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="70" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">6. Celery Worker</text>
    <line x1="70" y1="40" x2="70" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 7. WebSocket Server -->
  <g transform="translate(1040, 90)">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">7. WS Server</text>
    <line x1="60" y1="40" x2="60" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Message 1: User clicks Deploy -->
  <line x1="120" y1="160" x2="290" y2="160" stroke="#3b82f6" stroke-width="2" marker-end="url(#seqArrowBlue)"/>
  <rect x="135" y="145" width="140" height="18" rx="4" fill="#0f172a"/>
  <text x="205" y="158" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">1. Click "Deploy Now"</text>

  <!-- Message 2: Frontend -> FastAPI -->
  <line x1="290" y1="190" x2="460" y2="190" stroke="#3b82f6" stroke-width="2" marker-end="url(#seqArrowBlue)"/>
  <rect x="305" y="175" width="140" height="18" rx="4" fill="#0f172a"/>
  <text x="375" y="188" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">2. POST /projects/{id}/deploy</text>

  <!-- Message 3: FastAPI -> DB (Insert QUEUED) -->
  <line x1="460" y1="220" x2="630" y2="220" stroke="#2563eb" stroke-width="2" marker-end="url(#seqArrowBlue)"/>
  <rect x="475" y="205" width="140" height="18" rx="4" fill="#0f172a"/>
  <text x="545" y="218" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">3. INSERT (status='QUEUED')</text>

  <!-- Message 4: FastAPI -> Redis (LPUSH) -->
  <line x1="460" y1="250" x2="800" y2="250" stroke="#dc2626" stroke-width="2" marker-end="url(#seqArrowAmber)"/>
  <rect x="530" y="235" width="200" height="18" rx="4" fill="#0f172a"/>
  <text x="630" y="248" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">4. LPUSH celery execute_task(id)</text>

  <!-- Message 5: FastAPI -> Frontend 202 Accepted -->
  <line x1="460" y1="285" x2="290" y2="285" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#seqArrowGreen)"/>
  <rect x="305" y="270" width="140" height="18" rx="4" fill="#0f172a"/>
  <text x="375" y="283" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">5. 202 Accepted (&lt; 50ms)</text>

  <!-- Message 6: Browser connects WebSocket -->
  <line x1="120" y1="320" x2="1100" y2="320" stroke="#10b981" stroke-width="2" marker-end="url(#seqArrowGreen)"/>
  <rect x="450" y="305" width="300" height="18" rx="4" fill="#0f172a"/>
  <text x="600" y="318" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">6. Connect ws://backend/ws/logs/{id}?token=JWT</text>

  <!-- Message 7: WS subscribes Redis -->
  <line x1="1100" y1="350" x2="800" y2="350" stroke="#f59e0b" stroke-width="2" marker-end="url(#seqArrowAmber)"/>
  <rect x="850" y="335" width="200" height="18" rx="4" fill="#0f172a"/>
  <text x="950" y="348" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">7. SUBSCRIBE "deployments:{id}:logs"</text>

  <!-- Execution Box (Celery Loop) -->
  <g transform="translate(680, 390)">
    <rect x="0" y="0" width="460" height="210" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#c084fc">PARALLEL ASYNCHRONOUS EXECUTION &amp; LOG BROADCAST</text>

    <!-- Celery pops -->
    <line x1="90" y1="50" x2="290" y2="50" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#seqArrowPurple)"/>
    <text x="190" y="45" font-family="monospace" font-size="9" fill="#ddd6fe" text-anchor="middle">8. BRPOP celery (Claims task)</text>

    <!-- Update DB to BUILDING -->
    <line x1="290" y1="80" x2="-50" y2="80" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#seqArrowBlue)"/>
    <text x="120" y="75" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">9. UPDATE status='BUILDING'</text>

    <!-- Publish stage logs loop -->
    <rect x="100" y="100" width="340" height="55" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="110" y="118" font-family="monospace" font-size="10" font-weight="bold" fill="#fbbf24">10. 6 Stages: CLONE → BUILD → DEPLOY</text>
    <text x="110" y="133" font-family="monospace" font-size="9" fill="#cbd5e1">Celery PUBLISH "deployments:{id}:logs" "[STAGE] ..."</text>
    <text x="110" y="147" font-family="monospace" font-size="9" fill="#34d399">WS Server pushes frame to Browser Terminal (&lt; 10ms)</text>

    <!-- Final update to SUCCESS -->
    <line x1="290" y1="180" x2="-50" y2="180" stroke="#34d399" stroke-width="1.5" marker-end="url(#seqArrowGreen)"/>
    <text x="120" y="175" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">11. UPDATE status='SUCCESS', batch insert logs</text>
  </g>

  <!-- Complete banner -->
  <g transform="translate(100, 680)">
    <rect x="0" y="0" width="1000" height="40" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="500" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">✓ Lifecycle Complete: Durable ACID State Persisted in PostgreSQL • Live Terminal Auto-Scrolls with Build Trace</text>
  </g>
</svg>

