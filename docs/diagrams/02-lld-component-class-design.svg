<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="dropShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad2)"/>
  <rect x="15" y="15" width="1170" height="770" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#8b5cf6"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">🧩</text>
    <text x="55" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">StackForge — Low-Level Design (LLD) Component & Class Hierarchy</text>
    <text x="55" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">FastAPI Dependency Injection • SQLAlchemy 2.0 ORM • Pydantic v2 Schemas • Celery Task Pipeline</text>
  </g>

  <!-- COLUMN 1: API ROUTERS & CONTROLLERS (Width 260) -->
  <g transform="translate(40, 95)" filter="url(#dropShadow2)">
    <rect width="260" height="660" rx="10" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="26" rx="10" fill="#0284c7"/>
    <rect x="0" y="16" width="260" height="10" fill="#0284c7"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f0f9ff">1. API ROUTER LAYER</text>

    <!-- FastAPI App -->
    <rect x="15" y="40" width="230" height="120" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="25" y="60" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">&lt;&lt;ASGI Core&gt;&gt; main.py</text>
    <text x="25" y="80" font-family="monospace" font-size="11" fill="#cbd5e1">+ lifespan(app: FastAPI)</text>
    <text x="25" y="98" font-family="monospace" font-size="11" fill="#cbd5e1">+ add_middleware(CORS)</text>
    <text x="25" y="116" font-family="monospace" font-size="11" fill="#cbd5e1">+ add_middleware(Prometheus)</text>
    <text x="25" y="134" font-family="monospace" font-size="11" fill="#cbd5e1">+ include_router(api_v1)</text>

    <!-- Sub-Routers -->
    <rect x="15" y="175" width="230" height="220" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="25" y="195" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">&lt;&lt;Router&gt;&gt; api/v1/</text>
    <text x="25" y="215" font-family="monospace" font-size="10" fill="#93c5fd">auth.py:</text>
    <text x="35" y="232" font-family="monospace" font-size="10" fill="#cbd5e1">POST /login, /register</text>
    <text x="25" y="255" font-family="monospace" font-size="10" fill="#93c5fd">projects.py:</text>
    <text x="35" y="272" font-family="monospace" font-size="10" fill="#cbd5e1">GET, POST, DELETE</text>
    <text x="25" y="295" font-family="monospace" font-size="10" fill="#93c5fd">deployments.py:</text>
    <text x="35" y="312" font-family="monospace" font-size="10" fill="#cbd5e1">POST /{id}/deploy (202)</text>
    <text x="25" y="335" font-family="monospace" font-size="10" fill="#93c5fd">ws.py:</text>
    <text x="35" y="352" font-family="monospace" font-size="10" fill="#cbd5e1">/ws/logs/{id}?token=...</text>
    <text x="25" y="375" font-family="monospace" font-size="10" fill="#93c5fd">infra.py:</text>
    <text x="35" y="392" font-family="monospace" font-size="10" fill="#cbd5e1">GET /nodes, /stats</text>

    <!-- Dependencies Box -->
    <rect x="15" y="410" width="230" height="110" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="25" y="430" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">&lt;&lt;Dependencies&gt;&gt;</text>
    <text x="25" y="450" font-family="monospace" font-size="10" fill="#cbd5e1">+ Depends(get_db)</text>
    <text x="25" y="468" font-family="monospace" font-size="10" fill="#cbd5e1">+ Depends(get_current_user)</text>
    <text x="25" y="486" font-family="monospace" font-size="10" fill="#cbd5e1">+ Depends(get_redis)</text>
    <text x="25" y="504" font-family="monospace" font-size="10" fill="#cbd5e1">+ Depends(validate_token)</text>
  </g>

  <!-- COLUMN 2: DOMAIN SERVICES & PIPELINE (Width 290) -->
  <g transform="translate(320, 95)" filter="url(#dropShadow2)">
    <rect width="290" height="660" rx="10" fill="url(#cardGrad2)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="26" rx="10" fill="#7e22ce"/>
    <rect x="0" y="16" width="290" height="10" fill="#7e22ce"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#faf5ff">2. DOMAIN SERVICE LAYER</text>

    <!-- AuthService -->
    <rect x="15" y="40" width="260" height="115" rx="6" fill="#0f172a" stroke="#9333ea" stroke-width="1"/>
    <text x="25" y="60" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">AuthService (security.py)</text>
    <text x="25" y="80" font-family="monospace" font-size="10" fill="#cbd5e1">+ verify_password(plain, hash)</text>
    <text x="25" y="98" font-family="monospace" font-size="10" fill="#cbd5e1">+ get_password_hash(pwd)</text>
    <text x="25" y="116" font-family="monospace" font-size="10" fill="#cbd5e1">+ create_access_token(data)</text>
    <text x="25" y="134" font-family="monospace" font-size="10" fill="#cbd5e1">+ decode_token(jwt_token)</text>

    <!-- DeploymentService -->
    <rect x="15" y="170" width="260" height="115" rx="6" fill="#0f172a" stroke="#9333ea" stroke-width="1"/>
    <text x="25" y="190" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">DeploymentService</text>
    <text x="25" y="210" font-family="monospace" font-size="10" fill="#cbd5e1">+ trigger_deployment(proj_id)</text>
    <text x="25" y="228" font-family="monospace" font-size="10" fill="#cbd5e1">+ create_deployment_record()</text>
    <text x="25" y="246" font-family="monospace" font-size="10" fill="#cbd5e1">+ dispatch_celery_task()</text>
    <text x="25" y="264" font-family="monospace" font-size="10" fill="#cbd5e1">+ fallback_background_task()</text>

    <!-- DeploymentSimulator -->
    <rect x="15" y="300" width="260" height="150" rx="6" fill="#0f172a" stroke="#9333ea" stroke-width="1"/>
    <text x="25" y="320" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">DeploymentSimulator</text>
    <text x="25" y="338" font-family="monospace" font-size="10" fill="#94a3b8">deployment_simulator.py</text>
    <text x="25" y="358" font-family="monospace" font-size="10" fill="#cbd5e1">+ run_pipeline(deployment_id)</text>
    <text x="25" y="376" font-family="monospace" font-size="10" fill="#cbd5e1">- execute_stage(stage, delay)</text>
    <text x="25" y="394" font-family="monospace" font-size="10" fill="#cbd5e1">- publish_log(channel, text)</text>
    <text x="25" y="412" font-family="monospace" font-size="10" fill="#cbd5e1">- update_status(status)</text>
    <text x="25" y="430" font-family="monospace" font-size="10" fill="#cbd5e1">- batch_insert_logs()</text>

    <!-- Celery App -->
    <rect x="15" y="465" width="260" height="110" rx="6" fill="#0f172a" stroke="#9333ea" stroke-width="1"/>
    <text x="25" y="485" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">Celery Tasks (celery_app.py)</text>
    <text x="25" y="505" font-family="monospace" font-size="10" fill="#cbd5e1">@celery.task(name='run_deploy')</text>
    <text x="25" y="523" font-family="monospace" font-size="10" fill="#cbd5e1">def execute_deployment_task(id):</text>
    <text x="35" y="541" font-family="monospace" font-size="10" fill="#a78bfa">sim.run_pipeline(id)</text>
  </g>

  <!-- COLUMN 3: SQLALCHEMY 2.0 ORM MODELS (Width 290) -->
  <g transform="translate(630, 95)" filter="url(#dropShadow2)">
    <rect width="290" height="660" rx="10" fill="url(#cardGrad2)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="26" rx="10" fill="#1d4ed8"/>
    <rect x="0" y="16" width="290" height="10" fill="#1d4ed8"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#eff6ff">3. SQLALCHEMY 2.0 ORM MODELS</text>

    <!-- User Model -->
    <rect x="15" y="40" width="260" height="120" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
    <text x="25" y="60" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">User (app/models/user.py)</text>
    <text x="25" y="80" font-family="monospace" font-size="10" fill="#cbd5e1">+ id: Mapped[UUID] PK</text>
    <text x="25" y="98" font-family="monospace" font-size="10" fill="#cbd5e1">+ email: Mapped[str] UK</text>
    <text x="25" y="116" font-family="monospace" font-size="10" fill="#cbd5e1">+ hashed_password: Mapped[str]</text>
    <text x="25" y="134" font-family="monospace" font-size="10" fill="#cbd5e1">+ projects: Mapped[List[Project]]</text>

    <!-- Project Model -->
    <rect x="15" y="175" width="260" height="140" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
    <text x="25" y="195" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">Project (app/models/project.py)</text>
    <text x="25" y="215" font-family="monospace" font-size="10" fill="#cbd5e1">+ id: Mapped[UUID] PK</text>
    <text x="25" y="233" font-family="monospace" font-size="10" fill="#cbd5e1">+ user_id: Mapped[UUID] FK</text>
    <text x="25" y="251" font-family="monospace" font-size="10" fill="#cbd5e1">+ name: Mapped[str]</text>
    <text x="25" y="269" font-family="monospace" font-size="10" fill="#cbd5e1">+ repo_url: Mapped[str]</text>
    <text x="25" y="287" font-family="monospace" font-size="10" fill="#cbd5e1">+ branch: Mapped[str]</text>
    <text x="25" y="305" font-family="monospace" font-size="10" fill="#cbd5e1">+ deployments: List[Deployment]</text>

    <!-- Deployment Model -->
    <rect x="15" y="330" width="260" height="145" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
    <text x="25" y="350" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">Deployment (deployment.py)</text>
    <text x="25" y="370" font-family="monospace" font-size="10" fill="#cbd5e1">+ id: Mapped[UUID] PK</text>
    <text x="25" y="388" font-family="monospace" font-size="10" fill="#cbd5e1">+ project_id: Mapped[UUID] FK</text>
    <text x="25" y="406" font-family="monospace" font-size="10" fill="#cbd5e1">+ status: Mapped[str] INDEX</text>
    <text x="25" y="424" font-family="monospace" font-size="10" fill="#cbd5e1">+ commit_sha: Mapped[str]</text>
    <text x="25" y="442" font-family="monospace" font-size="10" fill="#cbd5e1">+ duration_seconds: Mapped[int]</text>
    <text x="25" y="460" font-family="monospace" font-size="10" fill="#cbd5e1">+ logs: List[DeploymentLog]</text>

    <!-- DeploymentLog Model -->
    <rect x="15" y="490" width="260" height="120" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
    <text x="25" y="510" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">DeploymentLog (log.py)</text>
    <text x="25" y="530" font-family="monospace" font-size="10" fill="#cbd5e1">+ id: Mapped[UUID] PK</text>
    <text x="25" y="548" font-family="monospace" font-size="10" fill="#cbd5e1">+ deployment_id: Mapped[UUID] FK</text>
    <text x="25" y="566" font-family="monospace" font-size="10" fill="#cbd5e1">+ stage: Mapped[str]</text>
    <text x="25" y="584" font-family="monospace" font-size="10" fill="#cbd5e1">+ message: Mapped[Text]</text>
  </g>

  <!-- COLUMN 4: PYDANTIC V2 SCHEMAS (Width 220) -->
  <g transform="translate(940, 95)" filter="url(#dropShadow2)">
    <rect width="220" height="660" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="26" rx="10" fill="#059669"/>
    <rect x="0" y="16" width="220" height="10" fill="#059669"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ecfdf5">4. PYDANTIC V2 SCHEMAS</text>

    <rect x="15" y="40" width="190" height="95" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="25" y="60" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">auth.py</text>
    <text x="25" y="78" font-family="monospace" font-size="10" fill="#cbd5e1">UserLogin</text>
    <text x="25" y="96" font-family="monospace" font-size="10" fill="#cbd5e1">UserRegister</text>
    <text x="25" y="114" font-family="monospace" font-size="10" fill="#cbd5e1">TokenResponse</text>

    <rect x="15" y="150" width="190" height="95" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="25" y="170" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">project.py</text>
    <text x="25" y="188" font-family="monospace" font-size="10" fill="#cbd5e1">ProjectCreate</text>
    <text x="25" y="206" font-family="monospace" font-size="10" fill="#cbd5e1">ProjectUpdate</text>
    <text x="25" y="224" font-family="monospace" font-size="10" fill="#cbd5e1">ProjectRead</text>

    <rect x="15" y="260" width="190" height="95" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="25" y="280" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">deployment.py</text>
    <text x="25" y="298" font-family="monospace" font-size="10" fill="#cbd5e1">DeploymentCreate</text>
    <text x="25" y="316" font-family="monospace" font-size="10" fill="#cbd5e1">DeploymentRead</text>
    <text x="25" y="334" font-family="monospace" font-size="10" fill="#cbd5e1">StageStatusDTO</text>

    <rect x="15" y="370" width="190" height="95" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="25" y="390" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">infra.py</text>
    <text x="25" y="408" font-family="monospace" font-size="10" fill="#cbd5e1">NodeMetricDTO</text>
    <text x="25" y="426" font-family="monospace" font-size="10" fill="#cbd5e1">FleetHealthDTO</text>
    <text x="25" y="444" font-family="monospace" font-size="10" fill="#cbd5e1">ClusterKPIResponse</text>
  </g>
</svg>

