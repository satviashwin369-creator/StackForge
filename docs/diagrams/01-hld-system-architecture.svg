<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="820" fill="url(#bgGrad)"/>
  <rect x="15" y="15" width="1170" height="790" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="url(#primaryGrad)"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="55" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">StackForge — High-Level Design (HLD) Architecture Blueprint</text>
    <text x="55" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Microservice-Decoupled Event-Driven Cloud Platform • 100% Codebase-Accurate Component Map</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(980, 42)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#34d399"/>
    <text x="30" y="19" font-family="monospace" font-size="11" font-weight="bold" fill="#a7f3d0">9 CONTAINERS LIVE</text>
  </g>

  <!-- ================= TIER 1: CLIENT & PRESENTATION TIER ================= -->
  <g transform="translate(40, 95)" filter="url(#dropShadow)">
    <rect width="1120" height="110" rx="10" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="26" rx="10" fill="#1e3a8a"/>
    <rect x="0" y="16" width="1120" height="10" fill="#1e3a8a"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#93c5fd">1. CLIENT & PRESENTATION TIER (PORT 3000)</text>

    <!-- Browser Box -->
    <rect x="25" y="40" width="220" height="55" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="40" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Developer Web Browser</text>
    <text x="40" y="78" font-family="monospace" font-size="11" fill="#93c5fd">http://localhost:3000</text>

    <!-- Next.js App Router Box -->
    <rect x="280" y="40" width="310" height="55" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="295" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Next.js 16.2.6 App Router</text>
    <text x="295" y="78" font-family="monospace" font-size="11" fill="#94a3b8">React 19.2 • Tailwind v4 (OKLCH)</text>

    <!-- Zustand Store Box -->
    <rect x="625" y="40" width="210" height="55" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="640" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Zustand Client Store</text>
    <text x="640" y="78" font-family="monospace" font-size="11" fill="#94a3b8">JWT Token & Cookie Hydration</text>

    <!-- Live Console Box -->
    <rect x="870" y="40" width="225" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="885" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#34d399">Live Console Terminal</text>
    <text x="885" y="78" font-family="monospace" font-size="11" fill="#94a3b8">useLiveLogs • Circular Buffer</text>
  </g>

  <!-- Connectors Tier 1 to Tier 2 -->
  <line x1="435" y1="205" x2="435" y2="245" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="230" font-family="monospace" font-size="10" fill="#93c5fd">HTTP REST (Bearer JWT)</text>

  <line x1="980" y1="205" x2="980" y2="245" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="990" y="230" font-family="monospace" font-size="10" fill="#34d399">WSS Handshake (?token=JWT)</text>

  <!-- ================= TIER 2: API & INGRESS GATEWAY TIER ================= -->
  <g transform="translate(40, 245)" filter="url(#dropShadow)">
    <rect width="1120" height="135" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="26" rx="10" fill="#0369a1"/>
    <rect x="0" y="16" width="1120" height="10" fill="#0369a1"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#e0f2fe">2. API & INGRESS GATEWAY TIER — FASTAPI 0.115 (PORT 8000)</text>

    <!-- Sub-Routers -->
    <rect x="25" y="40" width="240" height="75" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">REST Sub-Routers</text>
    <text x="35" y="78" font-family="monospace" font-size="10" fill="#94a3b8">/api/v1/auth • /projects</text>
    <text x="35" y="94" font-family="monospace" font-size="10" fill="#94a3b8">/api/v1/deployments • /infra</text>

    <!-- Auth Guard -->
    <rect x="290" y="40" width="250" height="75" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="305" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">JWT Security & Validation</text>
    <text x="305" y="78" font-family="monospace" font-size="10" fill="#94a3b8">Passlib Bcrypt (Work 12)</text>
    <text x="305" y="94" font-family="monospace" font-size="10" fill="#94a3b8">Pydantic v2 Request Schemas</text>

    <!-- WebSocket Server -->
    <rect x="565" y="40" width="260" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="580" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399">WebSocket Log Gateway</text>
    <text x="580" y="78" font-family="monospace" font-size="10" fill="#94a3b8">/api/v1/ws/logs/{id}?token=...</text>
    <text x="580" y="94" font-family="monospace" font-size="10" fill="#94a3b8">Subscribes Redis Pub/Sub Bus</text>

    <!-- Prometheus Exporter -->
    <rect x="850" y="40" width="245" height="75" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
    <text x="865" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fb923c">Prometheus Middleware</text>
    <text x="865" y="78" font-family="monospace" font-size="10" fill="#94a3b8">Exposes /metrics endpoint</text>
    <text x="865" y="94" font-family="monospace" font-size="10" fill="#94a3b8">Tracks latency, errors, active deploys</text>
  </g>

  <!-- Connectors Tier 2 to Tier 3 & Tier 4 -->
  <line x1="200" y1="380" x2="200" y2="430" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="210" y="410" font-family="monospace" font-size="10" fill="#c4b5fd">delay() Celery Task</text>

  <line x1="550" y1="380" x2="550" y2="430" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="560" y="410" font-family="monospace" font-size="10" fill="#fcd34d">SUBSCRIBE / LPUSH</text>

  <line x1="880" y1="380" x2="880" y2="430" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="890" y="410" font-family="monospace" font-size="10" fill="#93c5fd">SQLAlchemy 2.0 Queries</text>

  <!-- ================= TIER 3 & 4: ASYNC QUEUE & STORAGE TIER ================= -->
  <!-- Left: Celery Worker Pool -->
  <g transform="translate(40, 430)" filter="url(#dropShadow)">
    <rect width="340" height="170" rx="10" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="26" rx="10" fill="#5b21b6"/>
    <rect x="0" y="16" width="340" height="10" fill="#5b21b6"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ede9fe">3. CELERY 5.4 WORKER POOL</text>

    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">stackforge-worker</text>
    <text x="20" y="73" font-family="monospace" font-size="11" fill="#c4b5fd">app.celery_app.celery_app</text>
    
    <rect x="20" y="85" width="300" height="70" rx="6" fill="#0f172a" stroke="#6d28d9" stroke-width="1"/>
    <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#a78bfa">6-Stage Deployment Simulator:</text>
    <text x="30" y="123" font-family="monospace" font-size="10" fill="#94a3b8">CLONE → INSTALL → TEST</text>
    <text x="30" y="140" font-family="monospace" font-size="10" fill="#94a3b8">BUILD → PUSH → DEPLOY</text>
  </g>

  <!-- Middle: Redis 7 Broker & PubSub -->
  <g transform="translate(420, 430)" filter="url(#dropShadow)">
    <rect width="340" height="170" rx="10" fill="url(#cardGrad)" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="26" rx="10" fill="#991b1b"/>
    <rect x="0" y="16" width="340" height="10" fill="#991b1b"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fee2e2">4. REDIS 7 ALPINEMESSAGE HUB (:6379)</text>

    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">stackforge-redis</text>
    
    <rect x="20" y="70" width="300" height="85" rx="6" fill="#0f172a" stroke="#b91c1c" stroke-width="1"/>
    <text x="30" y="90" font-family="monospace" font-size="11" fill="#f87171">DB 0: Pub/Sub ("deployments:{id}:logs")</text>
    <text x="30" y="110" font-family="monospace" font-size="11" fill="#fca5a5">DB 1: Celery FIFO Broker (celery queue)</text>
    <text x="30" y="130" font-family="monospace" font-size="11" fill="#fecaca">DB 2: Celery Result Backend</text>
  </g>

  <!-- Right: PostgreSQL 16 Persistence -->
  <g transform="translate(800, 430)" filter="url(#dropShadow)">
    <rect width="360" height="170" rx="10" fill="url(#cardGrad)" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="26" rx="10" fill="#1e40af"/>
    <rect x="0" y="16" width="360" height="10" fill="#1e40af"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#dbeafe">5. POSTGRESQL 16 PERSISTENCE (:5432)</text>

    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">stackforge-db (ACID Relational Engine)</text>

    <rect x="20" y="70" width="320" height="85" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
    <text x="30" y="90" font-family="monospace" font-size="10" fill="#93c5fd">• users (UUID, email, bcrypt_hash)</text>
    <text x="30" y="108" font-family="monospace" font-size="10" fill="#93c5fd">• projects (UUID, name, repo_url, branch)</text>
    <text x="30" y="126" font-family="monospace" font-size="10" fill="#93c5fd">• deployments (UUID, status, commit_sha)</text>
    <text x="30" y="144" font-family="monospace" font-size="10" fill="#93c5fd">• deployment_logs (UUID, stage, message)</text>
  </g>

  <!-- Connectors Between Worker, Redis, and DB -->
  <path d="M 380 500 L 420 500" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 380 530 L 800 530" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ================= TIER 5: OBSERVABILITY & TELEMETRY TIER ================= -->
  <g transform="translate(40, 630)" filter="url(#dropShadow)">
    <rect width="1120" height="145" rx="10" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="26" rx="10" fill="#92400e"/>
    <rect x="0" y="16" width="1120" height="10" fill="#92400e"/>
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fef3c7">6. FULL OBSERVABILITY & MONITORING TIER</text>

    <!-- Prometheus -->
    <rect x="25" y="40" width="255" height="85" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="40" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Prometheus v3.5 (:9090)</text>
    <text x="40" y="80" font-family="monospace" font-size="10" fill="#94a3b8">15s Scrapes backend:8000/metrics</text>
    <text x="40" y="98" font-family="monospace" font-size="10" fill="#94a3b8">TSDB Metrics Storage Engine</text>
    <text x="40" y="114" font-family="monospace" font-size="10" fill="#34d399">✓ Volume: prometheus_data</text>

    <!-- Grafana -->
    <rect x="305" y="40" width="255" height="85" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="320" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Grafana 12.1.1 (:3001)</text>
    <text x="320" y="80" font-family="monospace" font-size="10" fill="#94a3b8">Auto-Provisioned Dashboards</text>
    <text x="320" y="98" font-family="monospace" font-size="10" fill="#94a3b8">Login: admin / admin</text>
    <text x="320" y="114" font-family="monospace" font-size="10" fill="#34d399">✓ Volume: grafana_data</text>

    <!-- Loki -->
    <rect x="585" y="40" width="255" height="85" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Grafana Loki 3.5 (:3100)</text>
    <text x="600" y="80" font-family="monospace" font-size="10" fill="#94a3b8">Compressed Log Chunk Store</text>
    <text x="600" y="98" font-family="monospace" font-size="10" fill="#94a3b8">LogQL Stream Analytics</text>
    <text x="600" y="114" font-family="monospace" font-size="10" fill="#34d399">✓ Volume: loki_data</text>

    <!-- Alloy -->
    <rect x="865" y="40" width="230" height="85" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="880" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Grafana Alloy v1.10</text>
    <text x="880" y="80" font-family="monospace" font-size="10" fill="#94a3b8">Discovers container logs</text>
    <text x="880" y="98" font-family="monospace" font-size="10" fill="#94a3b8">Dynamic service label parser</text>
    <text x="880" y="114" font-family="monospace" font-size="10" fill="#94a3b8">Pushes batches to Loki</text>
  </g>

  <!-- Connectors from API / Containers to Observability -->
  <path d="M 970 320 L 970 370 L 150 370 L 150 630" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  <text x="160" y="620" font-family="monospace" font-size="10" fill="#fbbf24">Scrapes :8000/metrics</text>
</svg>
