<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad5)"/>
  <rect x="15" y="15" width="1170" height="770" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#326ce5"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">☸️</text>
    <text x="55" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">StackForge — Kubernetes Production Cluster Architecture</text>
    <text x="55" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Declarative Manifests ('k8s/') • Hardened SecurityContext • KEDA Queue Autoscaling • PVC Persistence</text>
  </g>

  <!-- Ingress Gateway -->
  <g transform="translate(40, 95)" filter="url(#shadow5)">
    <rect width="1120" height="70" rx="8" fill="url(#cardGrad5)" stroke="#326ce5" stroke-width="1.5"/>
    <text x="25" y="28" font-family="monospace" font-size="13" font-weight="bold" fill="#60a5fa">INGRESS CONTROLLER: ingress.yaml (Host: stackforge.io • TLS 1.3 Termination)</text>
    <text x="25" y="52" font-family="monospace" font-size="11" fill="#cbd5e1">Route Rules:  / → frontend-service:3000   |   /api → backend-service:8000   |   /ws → backend-service:8000</text>
  </g>

  <!-- Namespace Boundary: 'stackforge' -->
  <g transform="translate(40, 180)" filter="url(#shadow5)">
    <rect width="1120" height="575" rx="10" fill="#0c1322" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="1120" height="30" rx="10" fill="#1e3a8a"/>
    <rect x="0" y="20" width="1120" height="10" fill="#1e3a8a"/>
    <text x="20" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#eff6ff">KUBERNETES NAMESPACE: 'stackforge' (k8s/namespace.yaml)</text>

    <!-- WORKLOAD 1: Frontend Deployment -->
    <g transform="translate(25, 45)">
      <rect width="340" height="240" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="24" rx="8" fill="#1e3a8a"/>
      <text x="15" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#93c5fd">Deployment: frontend-deployment</text>

      <text x="15" y="45" font-family="monospace" font-size="10" fill="#cbd5e1">Service: frontend-service (NodePort 3000)</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#cbd5e1">Replicas: 2 Pods</text>

      <!-- Pod 1 -->
      <rect x="15" y="80" width="145" height="135" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="25" y="100" font-family="monospace" font-size="10" font-weight="bold" fill="#60a5fa">frontend-pod-1</text>
      <text x="25" y="120" font-family="monospace" font-size="9" fill="#94a3b8">runAsNonRoot: true</text>
      <text x="25" y="138" font-family="monospace" font-size="9" fill="#94a3b8">UID: 1001 (nextjs)</text>
      <text x="25" y="156" font-family="monospace" font-size="9" fill="#94a3b8">req: 100m CPU</text>
      <text x="25" y="174" font-family="monospace" font-size="9" fill="#94a3b8">req: 128Mi RAM</text>
      <text x="25" y="195" font-family="monospace" font-size="9" fill="#34d399">✓ live/ready probe</text>

      <!-- Pod 2 -->
      <rect x="180" y="80" width="145" height="135" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="190" y="100" font-family="monospace" font-size="10" font-weight="bold" fill="#60a5fa">frontend-pod-2</text>
      <text x="190" y="120" font-family="monospace" font-size="9" fill="#94a3b8">runAsNonRoot: true</text>
      <text x="190" y="138" font-family="monospace" font-size="9" fill="#94a3b8">UID: 1001 (nextjs)</text>
      <text x="190" y="156" font-family="monospace" font-size="9" fill="#94a3b8">req: 100m CPU</text>
      <text x="190" y="174" font-family="monospace" font-size="9" fill="#94a3b8">req: 128Mi RAM</text>
      <text x="190" y="195" font-family="monospace" font-size="9" fill="#34d399">✓ live/ready probe</text>
    </g>

    <!-- WORKLOAD 2: Backend API Deployment -->
    <g transform="translate(390, 45)">
      <rect width="340" height="240" rx="8" fill="#111827" stroke="#0ea5e9" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="24" rx="8" fill="#0369a1"/>
      <text x="15" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#e0f2fe">Deployment: backend-deployment</text>

      <text x="15" y="45" font-family="monospace" font-size="10" fill="#cbd5e1">Service: backend-service (ClusterIP 8000)</text>
      <text x="15" y="65" font-family="monospace" font-size="10" fill="#cbd5e1">Replicas: 2 Pods (Horizontal Pod Autoscaler)</text>

      <!-- Pod 1 -->
      <rect x="15" y="80" width="145" height="135" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
      <text x="25" y="100" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">backend-pod-1</text>
      <text x="25" y="120" font-family="monospace" font-size="9" fill="#94a3b8">readOnlyRoot: true</text>
      <text x="25" y="138" font-family="monospace" font-size="9" fill="#94a3b8">drop: ["ALL"]</text>
      <text x="25" y="156" font-family="monospace" font-size="9" fill="#94a3b8">req: 200m CPU</text>
      <text x="25" y="174" font-family="monospace" font-size="9" fill="#94a3b8">req: 256Mi RAM</text>
      <text x="25" y="195" font-family="monospace" font-size="9" fill="#34d399">✓ GET /health</text>

      <!-- Pod 2 -->
      <rect x="180" y="80" width="145" height="135" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
      <text x="190" y="100" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">backend-pod-2</text>
      <text x="190" y="120" font-family="monospace" font-size="9" fill="#94a3b8">readOnlyRoot: true</text>
      <text x="190" y="138" font-family="monospace" font-size="9" fill="#94a3b8">drop: ["ALL"]</text>
      <text x="190" y="156" font-family="monospace" font-size="9" fill="#94a3b8">req: 200m CPU</text>
      <text x="190" y="174" font-family="monospace" font-size="9" fill="#94a3b8">req: 256Mi RAM</text>
      <text x="190" y="195" font-family="monospace" font-size="9" fill="#34d399">✓ GET /health</text>
    </g>

    <!-- WORKLOAD 3: Celery Worker & KEDA Autoscaler -->
    <g transform="translate(755, 45)">
      <rect width="340" height="240" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="24" rx="8" fill="#5b21b6"/>
      <text x="15" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#ede9fe">Worker: Celery &amp; KEDA Autoscaler</text>

      <rect x="15" y="40" width="310" height="45" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
      <text x="25" y="58" font-family="monospace" font-size="10" font-weight="bold" fill="#c084fc">KEDA Trigger: Redis LLEN celery &gt; 10</text>
      <text x="25" y="74" font-family="monospace" font-size="9" fill="#94a3b8">Autoscales Worker Pods from 1 up to 10 instances</text>

      <!-- Pods -->
      <rect x="15" y="100" width="145" height="115" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="25" y="120" font-family="monospace" font-size="10" font-weight="bold" fill="#c084fc">worker-pod-1</text>
      <text x="25" y="140" font-family="monospace" font-size="9" fill="#94a3b8">O-Fair Scheduler</text>
      <text x="25" y="158" font-family="monospace" font-size="9" fill="#94a3b8">Concurrency: 4</text>
      <text x="25" y="180" font-family="monospace" font-size="9" fill="#34d399">✓ Heartbeat ping</text>

      <rect x="180" y="100" width="145" height="115" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="190" y="120" font-family="monospace" font-size="10" font-weight="bold" fill="#c084fc">worker-pod-N</text>
      <text x="190" y="140" font-family="monospace" font-size="9" fill="#94a3b8">Dynamic Spawning</text>
      <text x="190" y="158" font-family="monospace" font-size="9" fill="#94a3b8">Scales under load</text>
      <text x="190" y="180" font-family="monospace" font-size="9" fill="#a78bfa">KEDA Controlled</text>
    </g>

    <!-- Bottom Row: Stateful Services & Secrets -->
    <!-- PostgreSQL StatefulSet -->
    <g transform="translate(25, 310)">
      <rect width="340" height="235" rx="8" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="24" rx="8" fill="#1e40af"/>
      <text x="15" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#dbeafe">Stateful: postgresql-0 (k8s/database/)</text>

      <text x="15" y="45" font-family="monospace" font-size="10" fill="#cbd5e1">Service: postgres-service (ClusterIP 5432)</text>
      
      <rect x="15" y="60" width="310" height="150" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
      <text x="25" y="85" font-family="monospace" font-size="11" font-weight="bold" fill="#60a5fa">PersistentVolumeClaim: 5Gi</text>
      <text x="25" y="105" font-family="monospace" font-size="10" fill="#94a3b8">accessModes: [ReadWriteOnce]</text>
      <text x="25" y="125" font-family="monospace" font-size="10" fill="#94a3b8">storageClassName: standard</text>
      <text x="25" y="150" font-family="monospace" font-size="10" fill="#34d399">Mount: /var/lib/postgresql/data</text>
      <text x="25" y="175" font-family="monospace" font-size="10" fill="#cbd5e1">Security: runAsUser: 999 (postgres)</text>
    </g>

    <!-- Redis StatefulSet -->
    <g transform="translate(390, 310)">
      <rect width="340" height="235" rx="8" fill="#111827" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="24" rx="8" fill="#991b1b"/>
      <text x="15" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#fee2e2">Stateful: redis-master (k8s/redis/)</text>

      <text x="15" y="45" font-family="monospace" font-size="10" fill="#cbd5e1">Service: redis-service (ClusterIP 6379)</text>
      
      <rect x="15" y="60" width="310" height="150" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1"/>
      <text x="25" y="85" font-family="monospace" font-size="11" font-weight="bold" fill="#f87171">Redis In-Memory Data Store</text>
      <text x="25" y="105" font-family="monospace" font-size="10" fill="#94a3b8">Role: Celery Broker &amp; WS Pub/Sub</text>
      <text x="25" y="130" font-family="monospace" font-size="10" fill="#34d399">Probe: redis-cli ping</text>
      <text x="25" y="155" font-family="monospace" font-size="10" fill="#cbd5e1">Resource: 100m CPU / 128Mi RAM</text>
      <text x="25" y="180" font-family="monospace" font-size="10" fill="#fca5a5">Volume: 1Gi PVC for AOF snapshots</text>
    </g>

    <!-- ConfigMaps & Secrets -->
    <g transform="translate(755, 310)">
      <rect width="340" height="235" rx="8" fill="#111827" stroke="#059669" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="24" rx="8" fill="#047857"/>
      <text x="15" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#ecfdf5">Config &amp; Secrets Management</text>

      <rect x="15" y="45" width="310" height="80" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="25" y="65" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">Secret: stackforge-secret</text>
      <text x="25" y="83" font-family="monospace" font-size="9" fill="#94a3b8">POSTGRES_PASSWORD (base64)</text>
      <text x="25" y="101" font-family="monospace" font-size="9" fill="#94a3b8">JWT_SECRET_KEY (HS256 256-bit)</text>

      <rect x="15" y="135" width="310" height="80" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="25" y="155" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">ConfigMap: backend-config</text>
      <text x="25" y="173" font-family="monospace" font-size="9" fill="#94a3b8">DATABASE_URL: postgres-service:5432</text>
      <text x="25" y="191" font-family="monospace" font-size="9" fill="#94a3b8">REDIS_URL: redis-service:6379/0</text>
    </g>
  </g>
</svg>

