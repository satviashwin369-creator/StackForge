<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="erdArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad6)"/>
  <rect x="15" y="15" width="1170" height="770" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#1d4ed8"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">🗄️</text>
    <text x="55" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">StackForge — PostgreSQL 16 Relational Entity-Relationship Diagram (ERD)</text>
    <text x="55" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">SQLAlchemy 2.0 ORM Schema • UUID Primary Keys • Cascade Deletes • Indexed Foreign Keys</text>
  </g>

  <!-- TABLE 1: USERS -->
  <g transform="translate(60, 110)" filter="url(#shadow6)">
    <rect width="260" height="230" rx="8" fill="url(#cardGrad6)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="28" rx="8" fill="#1e3a8a"/>
    <rect x="0" y="18" width="260" height="10" fill="#1e3a8a"/>
    <text x="15" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#eff6ff">TABLE: users</text>

    <text x="15" y="48" font-family="monospace" font-size="11" fill="#facc15">🔑 id: UUID (PK)</text>
    <text x="15" y="70" font-family="monospace" font-size="11" fill="#38bdf8">📧 email: VARCHAR(255) (UK, INDEX)</text>
    <text x="15" y="92" font-family="monospace" font-size="11" fill="#cbd5e1">🔒 hashed_password: VARCHAR</text>
    <text x="15" y="114" font-family="monospace" font-size="11" fill="#cbd5e1">👤 full_name: VARCHAR(100)</text>
    <text x="15" y="136" font-family="monospace" font-size="11" fill="#cbd5e1">✓ is_active: BOOLEAN (DEFAULT true)</text>
    <text x="15" y="158" font-family="monospace" font-size="11" fill="#94a3b8">⏱ created_at: TIMESTAMP WITH TZ</text>
    <text x="15" y="180" font-family="monospace" font-size="11" fill="#94a3b8">⏱ updated_at: TIMESTAMP WITH TZ</text>
    
    <line x1="10" y1="195" x2="250" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="15" y="215" font-family="monospace" font-size="10" fill="#a7f3d0">Relationships: owns 1:N projects</text>
  </g>

  <!-- TABLE 2: PROJECTS -->
  <g transform="translate(420, 110)" filter="url(#shadow6)">
    <rect width="320" height="250" rx="8" fill="url(#cardGrad6)" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="28" rx="8" fill="#0369a1"/>
    <rect x="0" y="18" width="320" height="10" fill="#0369a1"/>
    <text x="15" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#eff6ff">TABLE: projects</text>

    <text x="15" y="48" font-family="monospace" font-size="11" fill="#facc15">🔑 id: UUID (PK)</text>
    <text x="15" y="70" font-family="monospace" font-size="11" fill="#38bdf8">🔗 user_id: UUID (FK → users.id, INDEX)</text>
    <text x="15" y="92" font-family="monospace" font-size="11" fill="#cbd5e1">📦 name: VARCHAR(50)</text>
    <text x="15" y="114" font-family="monospace" font-size="11" fill="#cbd5e1">📝 description: TEXT (NULLABLE)</text>
    <text x="15" y="136" font-family="monospace" font-size="11" fill="#cbd5e1">🌐 repo_url: VARCHAR(255)</text>
    <text x="15" y="158" font-family="monospace" font-size="11" fill="#cbd5e1">🌿 branch: VARCHAR(100) (DEFAULT 'main')</text>
    <text x="15" y="180" font-family="monospace" font-size="11" fill="#cbd5e1">⚙ framework: VARCHAR(50)</text>
    <text x="15" y="202" font-family="monospace" font-size="11" fill="#94a3b8">⏱ created_at: TIMESTAMP WITH TZ</text>

    <line x1="10" y1="215" x2="310" y2="215" stroke="#334155" stroke-width="1"/>
    <text x="15" y="235" font-family="monospace" font-size="10" fill="#a7f3d0">Cascade: ON DELETE CASCADE from users</text>
  </g>

  <!-- Connector: USERS -> PROJECTS -->
  <line x1="320" y1="210" x2="420" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#erdArrow)"/>
  <text x="370" y="200" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">1 : N</text>

  <!-- TABLE 3: DEPLOYMENTS -->
  <g transform="translate(820, 110)" filter="url(#shadow6)">
    <rect width="320" height="290" rx="8" fill="url(#cardGrad6)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="28" rx="8" fill="#6d28d9"/>
    <rect x="0" y="18" width="320" height="10" fill="#6d28d9"/>
    <text x="15" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#eff6ff">TABLE: deployments</text>

    <text x="15" y="48" font-family="monospace" font-size="11" fill="#facc15">🔑 id: UUID (PK)</text>
    <text x="15" y="70" font-family="monospace" font-size="11" fill="#38bdf8">🔗 project_id: UUID (FK → projects.id, INDEX)</text>
    <text x="15" y="92" font-family="monospace" font-size="11" fill="#f43f5e">⚡ status: VARCHAR(20) (INDEX)</text>
    <text x="15" y="114" font-family="monospace" font-size="10" fill="#cbd5e1">   [QUEUED | BUILDING | SUCCESS | FAILED]</text>
    <text x="15" y="136" font-family="monospace" font-size="11" fill="#cbd5e1">🔖 commit_sha: VARCHAR(40)</text>
    <text x="15" y="158" font-family="monospace" font-size="11" fill="#cbd5e1">💬 commit_message: TEXT</text>
    <text x="15" y="180" font-family="monospace" font-size="11" fill="#cbd5e1">🌿 branch: VARCHAR(100)</text>
    <text x="15" y="202" font-family="monospace" font-size="11" fill="#cbd5e1">⏱ duration_seconds: INTEGER</text>
    <text x="15" y="224" font-family="monospace" font-size="11" fill="#94a3b8">⏱ created_at: TIMESTAMP (Queue time)</text>
    <text x="15" y="246" font-family="monospace" font-size="11" fill="#94a3b8">⏱ finished_at: TIMESTAMP (Exit time)</text>

    <line x1="10" y1="260" x2="310" y2="260" stroke="#334155" stroke-width="1"/>
    <text x="15" y="278" font-family="monospace" font-size="10" fill="#a7f3d0">Cascade: ON DELETE CASCADE from projects</text>
  </g>

  <!-- Connector: PROJECTS -> DEPLOYMENTS -->
  <line x1="740" y1="210" x2="820" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#erdArrow)"/>
  <text x="780" y="200" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">1 : N</text>

  <!-- TABLE 4: DEPLOYMENT_LOGS -->
  <g transform="translate(420, 470)" filter="url(#shadow6)">
    <rect width="520" height="230" rx="8" fill="url(#cardGrad6)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="28" rx="8" fill="#047857"/>
    <rect x="0" y="18" width="520" height="10" fill="#047857"/>
    <text x="15" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#eff6ff">TABLE: deployment_logs (Historical Log Traces)</text>

    <text x="15" y="48" font-family="monospace" font-size="11" fill="#facc15">🔑 id: UUID (PK)</text>
    <text x="15" y="70" font-family="monospace" font-size="11" fill="#38bdf8">🔗 deployment_id: UUID (FK → deployments.id, INDEX)</text>
    <text x="15" y="92" font-family="monospace" font-size="11" fill="#cbd5e1">🚩 stage: VARCHAR(30) [CLONE | INSTALL | TEST | BUILD | PUSH | DEPLOY]</text>
    <text x="15" y="114" font-family="monospace" font-size="11" fill="#cbd5e1">🏷 level: VARCHAR(10) [INFO | WARN | ERROR | DEBUG]</text>
    <text x="15" y="136" font-family="monospace" font-size="11" fill="#cbd5e1">📄 message: TEXT (Raw ANSI shell log output)</text>
    <text x="15" y="158" font-family="monospace" font-size="11" fill="#94a3b8">⏱ timestamp: TIMESTAMP WITH TIME ZONE (Emission time)</text>

    <line x1="10" y1="180" x2="510" y2="180" stroke="#334155" stroke-width="1"/>
    <text x="15" y="202" font-family="monospace" font-size="10" fill="#a7f3d0">Cascade: ON DELETE CASCADE from deployments • Batch inserted upon stage completion</text>
  </g>

  <!-- Connector: DEPLOYMENTS -> DEPLOYMENT_LOGS -->
  <path d="M 980 400 L 980 570 L 940 570" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#erdArrow)"/>
  <text x="1000" y="500" font-family="monospace" font-size="11" fill="#38bdf8">1 : N</text>

  <!-- Left: Architectural Callout Box -->
  <g transform="translate(60, 470)" filter="url(#shadow6)">
    <rect width="320" height="230" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">ACID Design Rationale</text>
    
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Strict Foreign Key Cascading:</text>
    <text x="30" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Deleting a user cleanly cascades to all projects,</text>
    <text x="30" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">deployments, and log lines with zero orphans.</text>

    <text x="20" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Indexed Status Filter:</text>
    <text x="30" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">B-tree indexing on deployments.status</text>
    <text x="30" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">enables fast KPI and dashboard aggregations.</text>

    <text x="20" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Dual Log Strategy:</text>
    <text x="30" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Live logs stream via Redis Pub/Sub; final logs</text>
    <text x="30" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">batch-persist in PostgreSQL for audit trails.</text>
  </g>
</svg>

