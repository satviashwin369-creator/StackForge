# StackForge — full-stack production compose
# Run from repo root: docker compose up --build

name: stackforge

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_URL: http://localhost:8000/api/v1
    container_name: stackforge-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stackforge-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stackforge-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PORT: "8000"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-stackforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackforge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-stackforge}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-stackforge}:${POSTGRES_PASSWORD:-stackforge_secret}@db:5432/${POSTGRES_DB:-stackforge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret-in-production}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stackforge-net
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stackforge-worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-stackforge}:${POSTGRES_PASSWORD:-stackforge_secret}@db:5432/${POSTGRES_DB:-stackforge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret-in-production}
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stackforge-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: stackforge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackforge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-stackforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stackforge} -d ${POSTGRES_DB:-stackforge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stackforge-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stackforge-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - stackforge-net
    restart: unless-stopped

networks:
  stackforge-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
