# StackForge Kubernetes Secret
# NOTE: This file contains local development/demo defaults for kind or minikube.
# In a production environment, secrets must NEVER be committed to Git. Instead,
# generate them via CI/CD, SealedSecrets, HashiCorp Vault, or AWS Secrets Manager:
#   kubectl create secret generic stackforge-secrets -n stackforge \
#     --from-literal=POSTGRES_PASSWORD='<secure-password>' \
#     --from-literal=DATABASE_URL='postgresql+psycopg2://stackforge:<secure-password>@db:5432/stackforge' \
#     --from-literal=JWT_SECRET_KEY='<secure-64-char-random-key>'

apiVersion: v1
kind: Secret
metadata:
  name: stackforge-secrets
  namespace: stackforge
  labels:
    app.kubernetes.io/name: stackforge
    app.kubernetes.io/part-of: stackforge
type: Opaque
stringData:
  POSTGRES_PASSWORD: "stackforge_dev_secret"
  DATABASE_URL: "postgresql+psycopg2://stackforge:stackforge_dev_secret@db:5432/stackforge"
  JWT_SECRET_KEY: "dev-only-change-me-to-a-long-random-secret-in-production-stackforge"
