apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: stackforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: ghcr.io/satviashwin369-creator/stackforge-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - celery
            - -A
            - app.celery_app.celery_app
            - worker
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stackforge-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/1
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/2
            - name: BACKEND_INTERNAL_URL
              value: http://backend:8000
            - name: CORS_ORIGINS
              value: http://localhost:3000,http://127.0.0.1:3000
            - name: DEBUG
              value: "false"
            - name: ENVIRONMENT
              value: production
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stackforge-secrets
                  key: JWT_SECRET_KEY
            - name: PORT
              value: "8000"
            - name: POSTGRES_DB
              value: stackforge
            - name: POSTGRES_HOST
              value: db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stackforge-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: stackforge